<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/navbar.css">
    <script src="/scripts/navbar.js"></script>
    <script src="/scripts/main.js"></script>
    <script src="/scripts/clubs.js"></script>
    <script src="/scripts/google.js"></script>
    <script src="/scripts/footer.js" defer></script>
    <script src="https://kit.fontawesome.com/1074444b18.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/assets/SEJMTRACKER-NOWE.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Klub | SejmTracker</title>
    <style>
        table{
            width: 250px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
            <p id="loadingText">Wczytuję dane...</p>
        </div>
    </div>

    <div id="info">
        <img id="photo" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif" alt="logo klubu" height="50px">
        <h1 id="name">Nazwa</h1>
        <p>Telefon: <span id="phone"></span></p>
        <p>Fax: <span id="fax"></span></p>
        <p id="email-form">Adres e-mail: <span id="email"></span></p>
        <div>
            <h1>Posłowie należący do ugrupowania (<span id="membersCount"></span>):</h1>
            <center>
                <div id="tab"></div>
            </center>
        </div>
    </div>
    <button id="scrollToTopButton" onclick="scrollToTop()"><i class="fa-solid fa-arrow-up"></i></button>
    <br>
    <script>
        updateNavbar();
    </script>
</body>
</html>
