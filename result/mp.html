<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/main.js"></script>
    <script src="/scripts/mp.js"></script>
    <script src="/scripts/google.js"></script>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/navbar.css">
    <script src="/scripts/navbar.js"></script>
    <script src="/scripts/footer.js" defer></script>
    <script src="https://kit.fontawesome.com/1074444b18.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/assets/SEJMTRACKER-NOWE.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Poseł | SejmTracker</title>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
            <p id="loadingText">Wczytuję dane...</p>
        </div>
    </div>
    <div style="display: none;" id="info">
        <center>
            <div id="div"></div>
        </center>
        <br>
        <img id="photo" src="" alt="zdjecie posla">
        <h1 id="lastFirstName">Imie Nazwisko</h1>
        <p>Numer legitymacji: <span id="id"></span></p>
        <p>Data urodzenia: <span id="dob"></span></p>
        <p>Miejsce urodzenia: <span id="pob"></span></p>
        <p>Klub: <span id="club"></span></p>
        <p>Okręg wyborczy: <span id="district"></span></p>
        <p>Województwo: <span id="voivodeship"></span></p>
        <p>Ilość głosów w wyborach: <span id="votesQty"></span></p>
        <p>Wykształcenie: <span id="educationLvl"></span></p>
        <p>Zawód: <span id="profession"></span></p>
        <p>Adres e-mail: <span id="email"></span></p>
        <p id="btnSpace"></p>
    </div>
    <button id="scrollToTopButton" onclick="scrollToTop()"><i class="fa-solid fa-arrow-up"></i></button>
    
    <br>
    <script>
        updateNavbar();
    </script>
</body>
</html>
